    <section class="contact-section section">
      <div class="section-number">08</div>
      <div class="section-heading reveal">
        <p class="eyebrow">CONTACT</p>
        <h2>MameTypeへの<br>お問い合わせ</h2>
      </div>
      <div class="contact-copy">
        <p class="lead">
          不具合報告・ご要望は、下記のフォームからお送りください。
        </p>
        <p class="note">
          このページではメールクライアントを開いて送信します。
          送信内容は自動的に件名・本文に反映されます。
        </p>

        <form class="contact-form" id="contact-form" novalidate>
          <div class="form-group">
            <p class="form-label">お問い合わせ種別</p>
            <div class="radio-group">
              <label class="radio-card">
                <input type="radio" name="type" value="bug" checked>
                <span class="radio-label">不具合報告</span>
              </label>
              <label class="radio-card">
                <input type="radio" name="type" value="request">
                <span class="radio-label">ご要望・その他</span>
              </label>
            </div>
          </div>

  <footer class="site-footer">
    <div class="footer-brand">
      <span class="brand-mark">M</span>
      <div><strong>MameType</strong><small>毎日のタイピングが、成長になる。</small></div>
    </div>
    <div class="footer-links">
      <a href="index.html#about">ABOUT</a>
      <a href="index.html#features">FEATURES</a>
      <a href="index.html#start">HOW TO START</a>
      <a href="https://x.com/mamelog0103" target="_blank" rel="noopener">X</a>
      <a href="https://note.com/mamelog0103" target="_blank" rel="noopener">NOTE</a>
  <script>
    (function(){
      var subjectEl = document.getElementById('subject');
      var contentEl = document.getElementById('content');
      var replyEl = document.getElementById('reply');
      var sendButton = document.getElementById('send-button');
      var typeRadios = document.getElementsByName('type');

      function getSelectedType(){
        for (var i = 0; i < typeRadios.length; i++){
          if (typeRadios[i].checked) return typeRadios[i].value;
        }
        return 'bug';
      }

      function encodeParam(value){
        if (!value) return '';
        return encodeURIComponent(String(value).replace(/\r?\n/g, '\r\n'));
      }

      function buildMailto(){
        var type = getSelectedType();
        var subjectRaw = subjectEl.value.trim();
        var contentRaw = contentEl.value.trim();
        var replyRaw = replyEl.value.trim();

        var baseSubject = type === 'bug' ? 'MameType 不具合報告' : 'MameType ご要望・その他';

        if (subjectRaw) baseSubject = baseSubject + ' — ' + subjectRaw;

        var bodyParts = [];
        bodyParts.push('【種別】');
        bodyParts.push(type === 'bug' ? '不具合報告' : 'ご要望・その他');
        bodyParts.push('');

        if (subjectRaw) bodyParts.push('【題名】\n' + subjectRaw);
        if (contentRaw) bodyParts.push('\n【内容】\n' + contentRaw);
        if (replyRaw) bodyParts.push('\n【連絡用メール】\n' + replyRaw);

        var subject = encodeParam(baseSubject);
        var body = encodeParam(bodyParts.join('\n'));

        return 'mailto:mamelog0103@gmail.com?subject=' + subject + '&body=' + body;
      }

      function handleSend(){
        var subject = subjectEl.value.trim();
        var content = contentEl.value.trim();

        if (!subject && !content){
          subjectEl.focus();
          return;
        }

        var mailto = buildMailto();
        window.location.href = mailto;
      }

      sendButton.addEventListener('click', handleSend);
    })();
  </script>

      <a href="mailto:mamelog0103@gmail.com?subject=MameType%20不具合報告">CONTACT</a>
      <a href="mailto:mamelog0103@gmail.com?subject=MameType%20ご要望・その他">CONTACT</a>
    </div>
    <p>© MameType</p>
  </footer>

          <div class="form-group">
            <label class="form-label" for="subject">題名</label>
            <input class="form-input" type="text" id="subject" name="subject" placeholder="例: ステージ3でクラッシュする">
          </div>

          <div class="form-group">
            <label class="form-label" for="content">内容</label>
            <textarea class="form-input form-textarea" id="content" name="content" rows="8" placeholder="起こったこと、再現方法、期待している動作などをご記入ください。"></textarea>
          </div>

          <div class="form-group">
            <label class="form-label" for="reply">連絡用メール（任意）</label>
            <input class="form-input" type="email" id="reply" name="reply" placeholder="返信を希望する場合のみご記入ください">
          </div>

          <div class="form-actions">
            <button class="button button-primary" type="button" id="send-button">
              送信する <span>→</span>
            </button>
            <a class="button button-ghost" href="index.html">戻る</a>
          </div>
        </form>
      </div>
